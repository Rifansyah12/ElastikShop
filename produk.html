<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elastik Shop - Semua Produk</title>
    <style>
      /* ===== SALIN SEMUA STYLE DARI index.html ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        background: #f5f5f5;
        color: #222;
      }
      header {
        background: #111827;
        color: white;
        padding: 20px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: bold;
        color: #facc15;
      }
      .logo img {
        width: 50px;
        height: 50px;
        object-fit: contain;
      }
      nav {
        display: flex;
        gap: 20px;
      }
      nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        transition: 0.3s;
      }
      nav a:hover {
        color: #facc15;
      }
      .hamburger {
        display: none;
        background: none;
        border: none;
        color: white;
        font-size: 30px;
        cursor: pointer;
        z-index: 1001;
      }
      @media (max-width: 768px) {
        .hamburger {
          display: block;
        }
        nav {
          position: fixed;
          top: 0;
          right: -100%;
          width: 70%;
          max-width: 280px;
          height: 100vh;
          background: #111827;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 30px;
          transition: 0.3s ease;
          z-index: 1000;
          box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
        }
        nav a {
          margin-left: 0;
          font-size: 20px;
        }
        nav.show {
          right: 0;
        }
        .overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          z-index: 999;
        }
        .overlay.show {
          display: block;
        }
      }
      .btn {
        display: inline-block;
        padding: 15px 30px;
        background: #facc15;
        color: #111827;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn:hover {
        background: white;
      }
      section {
        padding: 80px 8%;
      }
      .title {
        text-align: center;
        margin-bottom: 50px;
      }
      .title h2 {
        font-size: 40px;
        color: #111827;
        margin-bottom: 10px;
      }
      .title p {
        color: #555;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }
      .gallery img {
        width: 100%;
        border-radius: 15px;
        object-fit: cover;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      footer {
        background: #0f172a;
        color: white;
        text-align: center;
        padding: 25px;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="logo-elastik.png" alt="Logo" /><span>Elastik Shop</span>
      </div>
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="produk.html">Produk</a>
        <a href="custom.html">Custom</a>
        <a href="contact.html">Kontak</a>
      </nav>
      <div id="overlay" class="overlay"></div>
    </header>

    <section>
      <div class="title">
        <h2>Semua Koleksi Produk</h2>
        <p>Berbagai model gantungan kunci custom dari bahan karet premium</p>
      </div>
      <div class="gallery">
        <img src="persib.png" alt="Produk 1" />
        <img src="mouckup01.png" alt="Produk 2" />
        <img src="persib2.png" alt="Produk 3" />
        <img src="mockup.png" alt="Produk 4" />
        <img src="persib.png" alt="Produk 5" />
        <img src="mouckup01.png" alt="Produk 6" />
      </div>
      <div style="text-align: center; margin-top: 40px">
        <a href="custom.html" class="btn">Pesan Custom Sekarang</a>
      </div>
    </section>

    <footer>
      © 2026 Elastik Shop - Jasa Pembuatan Gantungan Kunci Karet Custom
    </footer>

    <script>
      const hamburger = document.getElementById("hamburgerBtn");
      const navMenu = document.getElementById("navMenu");
      const overlay = document.getElementById("overlay");
      function toggleMenu() {
        navMenu.classList.toggle("show");
        overlay.classList.toggle("show");
        hamburger.innerHTML = navMenu.classList.contains("show") ? "✕" : "☰";
      }
      hamburger.addEventListener("click", toggleMenu);
      overlay.addEventListener("click", toggleMenu);
      document.querySelectorAll("#navMenu a").forEach((link) =>
        link.addEventListener("click", () => {
          if (navMenu.classList.contains("show")) toggleMenu();
        }),
      );
      window.addEventListener("resize", function () {
        if (window.innerWidth > 768 && navMenu.classList.contains("show")) {
          navMenu.classList.remove("show");
          overlay.classList.remove("show");
          hamburger.innerHTML = "☰";
        }
      });
    </script>
  </body>
</html>
